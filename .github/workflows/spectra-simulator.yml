name: SPECTRA Simulator

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - "index.html"
      - "tsconfig.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - ".github/workflows/spectra-simulator.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "tsconfig.json"
      - "vite.config.ts"
      - "vitest.config.ts"
      - ".github/workflows/spectra-simulator.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests and architecture guard
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium for browser smoke test
        run: npx playwright install --with-deps chromium
      - name: Smoke test the built app in a browser
        run: npm run test:smoke
